<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pardis Properties | Projects</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body class="landing-body themed-bg">

<div class="landing">

  <header class="landing-header">
    <img src="images/pardis-logo.png" alt="Pardis" class="brand-logo">
    <p class="landing-sub">Select a project to open its live inventory.</p>
  </header>

  <section class="project-grid" id="projectGrid">

    <a class="project-card" href="dashboard.html">
      <div class="project-card-image">
        <img src="images/sai-saburi.jpg" alt="Sai Saburi building render">
        <span class="project-card-badge">Live</span>
      </div>
      <div class="project-card-body">
        <h2>Sai Saburi</h2>
        <p class="project-card-loc">Pardis Properties</p>

        <div class="project-stat-row" id="saiSaburiStats">
          <span class="project-stat"><b id="ps-total">—</b>Total</span>
          <span class="project-stat"><b id="ps-available">—</b>Available</span>
          <span class="project-stat"><b id="ps-hold">—</b>Hold</span>
          <span class="project-stat"><b id="ps-sold">—</b>Sold</span>
        </div>

        <div class="project-progress">
          <div class="project-progress-track">
            <div class="project-progress-fill" id="ps-progress-fill"></div>
          </div>
          <span class="project-progress-label" id="ps-progress-label">— sold</span>
        </div>
      </div>
    </a>

    <div class="project-card project-card-empty">
      <div class="project-card-image">
        <img src="images/chitragandha.jpg" alt="Chitragandha building render">
        <span class="project-card-badge badge-pending">Coming soon</span>
      </div>
      <div class="project-card-body">
        <h2>Chitragandha</h2>
        <p class="project-card-loc">Pardis Properties</p>
        <p class="project-card-placeholder">Inventory details coming soon.</p>
      </div>
    </div>

  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
(async function loadSaiSaburiStats() {
    const { data, error } = await db.from("units").select("status");
    if (error || !data) return;

    const total = data.length;
    const available = data.filter(u => u.status === "available").length;
    const hold = data.filter(u => u.status === "hold").length;
    const sold = data.filter(u => u.status === "sold").length;
    const pct = total ? Math.round((sold / total) * 100) : 0;

    document.getElementById("ps-total").textContent = total;
    document.getElementById("ps-available").textContent = available;
    document.getElementById("ps-hold").textContent = hold;
    document.getElementById("ps-sold").textContent = sold;
    document.getElementById("ps-progress-fill").style.width = pct + "%";
    document.getElementById("ps-progress-label").textContent = pct + "% sold";
})();
</script>

</body>
</html>
